name: build-client

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The server onion is NOT embedded in the package — the user enters it by
# hand on the Login screen at first launch (then remembered in ~/.config/onionmail/client.json).

permissions:
  contents: write   # to create a Release on a tag

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            teb: tor-expert-bundle-windows-x86_64-14.0.1.tar.gz
            artifact: onionmail-windows
          - os: macos-latest
            teb: tor-expert-bundle-macos-aarch64-14.0.1.tar.gz
            artifact: onionmail-macos
          - os: ubuntu-latest
            teb: tor-expert-bundle-linux-x86_64-14.0.1.tar.gz
            artifact: onionmail-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux Qt/xcb system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 libegl1 libgl1 libpulse0 libdbus-1-3

      - name: dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 PySocks argon2-cffi aiosmtpd textual
          pip install -e .

      - name: Tor Expert Bundle indir
        shell: bash
        run: |
          set -e
          V=14.0.1
          URL="https://archive.torproject.org/tor-package-archive/torbrowser/${V}/${{ matrix.teb }}"
          mkdir tor_dl && curl -fL "$URL" -o tor_dl/teb.tar.gz
          tar -xzf tor_dl/teb.tar.gz -C tor_dl
          mkdir -p tor
          # TEB layout: tor/tor(.exe) (+ libevent etc. on macOS)
          cp -R tor_dl/tor/. tor/
          ls -R tor

      - name: PyInstaller
        env:
          TOR_DIR: tor
        run: pyinstaller --noconfirm packaging/onionmail.spec

      - name: paketle
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" onionmail
          else
            zip -qr "../${{ matrix.artifact }}.zip" onionmail
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: attach to release (if a tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
