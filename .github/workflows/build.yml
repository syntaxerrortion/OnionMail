name: build-client

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# İsteğe bağlı: repo -> Settings -> Secrets and variables -> Actions -> Variables
#   SERVER_ONION = <sunucunun .onion adresi>
# Tanımlıysa paketlere gömülür; arkadaş ilk açılışta onion girmek zorunda kalmaz.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            teb: tor-expert-bundle-windows-x86_64-14.0.1.tar.gz
            artifact: onionmail-windows
          - os: macos-latest
            teb: tor-expert-bundle-macos-aarch64-14.0.1.tar.gz
            artifact: onionmail-macos
          - os: ubuntu-latest
            teb: tor-expert-bundle-linux-x86_64-14.0.1.tar.gz
            artifact: onionmail-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 PySocks argon2-cffi aiosmtpd textual
          pip install -e .

      - name: Tor Expert Bundle indir
        shell: bash
        run: |
          set -e
          V=14.0.1
          URL="https://archive.torproject.org/tor-package-archive/torbrowser/${V}/${{ matrix.teb }}"
          mkdir tor_dl && curl -fL "$URL" -o tor_dl/teb.tar.gz
          tar -xzf tor_dl/teb.tar.gz -C tor_dl
          mkdir -p tor
          # TEB düzeni: tor/tor(.exe) (+ macOS'ta libevent vb.)
          cp -R tor_dl/tor/. tor/
          ls -R tor

      - name: sunucu onion'unu göm (varsa)
        shell: bash
        run: |
          ONION="${{ vars.SERVER_ONION }}"
          if [ -n "$ONION" ]; then
            printf '{\n  "server_onion": "%s",\n  "preshared_key": "",\n  "socks_host": "127.0.0.1",\n  "socks_port": 9250\n}\n' "$ONION" > packaging/client.default.json
            echo "gömüldü: $ONION"
          else
            echo "SERVER_ONION tanımsız — arkadaş ilk açılışta girecek"
          fi

      - name: PyInstaller
        env:
          TOR_DIR: tor
        run: pyinstaller --noconfirm packaging/onionmail.spec

      - name: paketle
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" onionmail
          else
            zip -qr "../${{ matrix.artifact }}.zip" onionmail
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: sürüme ekle (tag ise)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
