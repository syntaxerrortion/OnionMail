# onionmail configuration. Copy to: ~/.config/onionmail/config.toml
# Path precedence: --config FLAG > ONIONMAIL_CONFIG env > ~/.config/onionmail/config.toml

[identity]
# Your own onion address. Leave empty to read it from hostname_file (Tor generates it).
onion = ""
hostname_file = "/var/lib/tor/onionmail/hostname"
# Mail addressed to <local_user>@<onion> is accepted.
local_user = "nejarm"
# Extra full addresses to accept (e.g. aliases).
extra_addresses = []

[smtpd]
# Tor's HiddenServicePort forwards here. NEVER bind to 0.0.0.0.
host = "127.0.0.1"
port = 8025
max_message_bytes = 26214400   # 25 MiB
max_rcpt = 10

[sender]
socks_host = "127.0.0.1"
socks_port = 9050              # Tor SOCKS; use 9150 if you run Tor Browser
timeout = 120                 # onion can be slow, keep it generous
# Retry intervals after a failed delivery (seconds). Give up after the last value.
retry_delays = [60, 300, 900, 3600, 10800, 43200]

[storage]
maildir = "~/.local/share/onionmail/Maildir"

[policy]
# If true, mail is accepted only from onions in the allowed_sender_onions list.
allowlist_only = false
allowed_sender_onions = []

# ------------------------------------------------------------------------
# MULTI-USER MODE (login over the network). If off, single mailbox = [identity].local_user.
# ------------------------------------------------------------------------
[accounts]
enabled = false                                   # true: a separate account per user
store_path = "~/.local/share/onionmail/accounts"  # on the server: /var/lib/onionmail/accounts
open_registration = false                         # false: registration requires an invite code
session_ttl = 3600                                # session token lifetime (s)
max_failed = 5                                    # lock after this many failed logins
lock_minutes = 15
min_password_len = 8

[api]
# The apid service. Tor publishes it on the same .onion via a 2nd HiddenServicePort.
host = "127.0.0.1"
port = 8443
preshared_key = ""                               # if non-empty, the client must supply it too

# ------------------------------------------------------------------------
# CLIENT side (on the machine where the GUI runs). Not needed on the server.
# The GUI Settings panel can also write these to ~/.config/onionmail/client.json.
# ------------------------------------------------------------------------
[client]
server_onion = ""                                # the .onion of the server to connect to
preshared_key = ""
session_path = "~/.config/onionmail/session.json"

[sandbox]
# For opening untrusted attachments / HTML in an isolated environment.
backend = "firejail"          # "firejail" | "bwrap" | "none"
workdir = "~/.cache/onionmail/sandbox"
# Viewer used when opening an attachment. Runs inside the sandbox.
viewer = "xdg-open"
