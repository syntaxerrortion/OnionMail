[project]
name = "onionmail"
version = "0.1.0"
description = "Tor onion-to-onion SMTP mail server with a terminal UI"
requires-python = ">=3.11"
dependencies = [
    "aiosmtpd>=1.4",
    "PySocks>=1.7",
    "textual>=0.60",
    "argon2-cffi>=23",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
pgp = ["python-gnupg>=0.5"]
dev = ["pytest>=8"]

[project.scripts]
onionmail = "onionmail.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["onionmail"]
